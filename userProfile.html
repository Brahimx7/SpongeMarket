<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="./css/nav.css">
     <link rel="stylesheet" href="./css/userProfile.css">
       <link rel="stylesheet" href="css/toast.css">
     <link rel="icon" href="favicon.png">
</head>

<body>
    <div id="nav"></div>

<div id="deleteModal" class="hidden">
   
        <h2 id="deleteTitle">delete product</h2>

        
     <div class="DeleteButtons">
         <button id="cancelDelete">Cancel</button>
        <button id="confirmDelete">Delete</button>
     </div>
        
   
</div>

<div class="profile-container">

                <div class="profile-menu">

                       <button id="aboutBtn" >👤 About Me</button>

                      <button id="favoritesBtn">❤️ Saved</button>
                     
                      <button id="messagesBtn">💬 Messages</button>

                       <button id="settingsBtn">⚙️ Settings</button>

                 </div>

    <div id="aboutSection">

                  <div class="profile-header">

                            <div class="avatar">
                                 <img id="aboutAvatarImg" src="./AvatarImg/defaultAvatar.png" alt="Avatar">
                            </div>

                            <div class="profile-info">
            
                                <h1 id="profileUsername">Ahmed Chakir</h1>
 
                                <div class="info-box">
                                    <h3>Email</h3>
                                   <p id="profilemail">ahmed@gmail.com</p>
                                </div>

                                 <div class="info-box">
                                     <h3>Products Posted</h3>
                                     <p><span id="profileproducts">0</span></p>
                                     <h3>Date Joined :</h3>
                                     <p><span id="profilejoined">0</span></p>
                                 </div>

                             </div>

                     
                       </div>

                 <h2 id="Title">Your Products</h2>
                  


              <div id="userproducts" class="userproducts"></div>
                    <div id="illustrations">
                       <img src="AvatarImg/SadMrKrabs.png" alt="NoProducts" id="sadMrKrabs">
                       <img src="AvatarImg/message.png" alt="messageIcon" id="messageIcon">
                       <p id="noProductsPosted">You haven't posted <br>any products yet.</p>
                      </div>
         
    </div>
         
         <div id="favoritesSection" class="hidden">
              <div id="savedproducts" class="userproducts"></div>
                     <div id="illustrations2">
                       <img src="AvatarImg/sadSquidward.png" alt="NoProducts" id="sadSquidward">
                       <img src="AvatarImg/message.png" alt="messageIcon" id="messageIcon2">
                       <p id="noProductsSaved">You haven't posted <br>any products yet.</p>
                      </div>
         </div>

       
              <div id="messagesSection" class="hidden">
                 
                        <div id="conversationList"></div>

                    <div id="chatArea" class="hidden">
                             <h2 id="productName">Product</h2>
                              <div id="messagesContainer"></div>

                           <div class="typesendmessages">
                                <input
                                   type="text"
                                     id="messageInput"
                                        placeholder="Type your message..."
                                            class="hidden">

                                 <button id="sendBtn" class="hidden">Send</button>
                          </div>

                    </div>

              </div>



   <div id="settingsSection" class="hidden">
                      
                       <div id="settingsMsg" class="hidden"></div>

                      <div class="settings-card">
                                <div class="profileImage">
                                        <h3>Profile Picture</h3>
                                         <div class="settingsAvatar">
                                               <img id="settingsAvatarImg" src="./AvatarImg/defaultAvatar.png" alt="Avatar">
                                               <button id="uploadAvatarBtn" type="button">📸</button>
                                                <input type="file" id="avatarInput" accept="image/*" style="display: none;">  
                                         </div>
                                 </div>
                         </div>
                        
        

                        <div class="settings-card">
                              <h3>Profile Info</h3>
                              <label>Username
                                  <input type="text" id="settingsUsername" placeholder="Your username">
                              </label>
                              <label>Email
                                 <input type="email" id="settingsEmail" placeholder="you@email.com">
                              </label>
                               <label>Bio
                                <textarea
                                  id="settingsBio"
                                  placeholder="Tell people a little about yourself..."
                                  maxlength="320"
                              ></textarea>
                              </label>
                             <button id="saveProfileBtn">Save Changes</button>
                       </div>

                         <div class="settings-card">
                              <h3>Change Password</h3>
                              <label>New Password
                                 <input type="password" id="newPassword" placeholder="Min 6 characters">
                              </label>
                              <label>Confirm Password
                                <input type="password" id="confirmPassword" placeholder="Repeat password">
                             </label>
                             <button id="savePasswordBtn">Update Password</button>
                         </div>

                          <div class="settings-card">
                              <button id="logoutBtn" class="danger">Logout</button>
                          </div>
             </div>
   
            
            
              
</div>


<script type="module" src="js/supabase.js"></script>
<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/userProfile.js"></script>
</body>

</html>
