<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="./css/sign.css">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/toast.css">
    <link rel="icon" href="favicon.png">
</head>
<body>
    
         <div id="nav"></div>

    <div class="signup-page">

    <div class="signup-card">

        <div class="signup-icon">
            👤
        </div>

        <h1>Create Account</h1>

        <p>Join SpongeMarket and start buying or selling today.</p>

        <form id="signinform">

            <input
                type="text"
                placeholder="Full Name" id="username" required>

            <input
                type="email"
                placeholder="Email Address" id="useremail" required> 
              <div class="password">
                                    <input
                                           type="password"
                                    placeholder="Password" id="pass" required>
                          <input type="checkbox" id="showpass">
              </div>

              <div class="confirmpassword">
                                    <input
                                           type="password"
                                    placeholder="Confirm Password" id="confpass" required>
                          <input type="checkbox" id="showconfpass">
              </div>
           
            <button type="submit">
                Sign Up
            </button>

        </form>

        <span>
            Already have an account?
            <a href="login.html">Login</a>
        </span>


        <div class="hidden" id="successful_email_panel">
              <h2>Account created! Please check your email to verify your account.</h2>
              <div class="email_actions">
              <p id="close">close</p>
              </div>
        </div>

    </div>

    

</div>
<div id="foot"></div>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/signin.js"></script>
</body>
</html>
